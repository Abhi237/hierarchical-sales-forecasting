name: CI
on:
  push:
  pull_request:
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install
        run: |
          pip install -r requirements-ci.txt
          pip install -e . --no-deps
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (committed M5-format fixture; no raw data needed)
        run: pytest -v
